---
layout: default
---

<div class="post-content">
  <h1>
    {{ page.title }}
  </h1>
 {% if page.image %}
  <div class="featured-image">
    <img
      src="{{ site.github.url }}/assets/img/{{ page.image }}"
      alt="{{ page.image_alt | escape }}"
    >
  </div>
{% endif %}
  <article>
    {{ content }}
  </article>
  {% if site.data.settings.disqus.comments %}
    {% include disqus.html %}
  {% endif %}
</div>
